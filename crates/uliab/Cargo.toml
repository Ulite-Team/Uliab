[package]
name = "uliab"
description = "The ulb build tool CLI: loads and runs wasm32-wasip2 plugins in an embedded wasmtime host"
edition.workspace = true
version.workspace = true
license = "GPL-3.0"

[dependencies]
ulb-lang = { path = "../ulb-lang" }
ulb-schema = { path = "../ulb-schema" }
ulb-plugin-sdk = { path = "../ulb-plugin-sdk" }
# The `cache` feature keeps compiled plugin artifacts in the engine's
# on-disk compilation cache (`~/.cache/wasmtime`), so a plugin compiled
# once for a given engine configuration is not recompiled on later loads.
wasmtime = { version = "47", features = ["cache"] }
# The wasm32-wasip2 std runtime imports wasi:io/poll (and friends) even in a
# pure-compute plugin, so the linker must be able to satisfy those imports.
wasmtime-wasi = "47"
# Registry index + artifact fetching for the plugin registry client.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"
# POM parsing for the Maven dependency resolver.
quick-xml = "0.37"

[lints]
workspace = true
