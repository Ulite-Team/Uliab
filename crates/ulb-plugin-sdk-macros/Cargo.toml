[package]
name = "ulb-plugin-sdk-macros"
description = "Procedural macros for the ulb plugin SDK: #[derive(UlbConfig)] turns one config struct into typed deserialization plus the embedded schema catalog."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
