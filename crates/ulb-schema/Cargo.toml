[package]
name = "ulb-schema"
description = "Plugin config schema types and binary-level wasm extraction for the ulb build DSL"
edition.workspace = true
version.workspace = true
license = "GPL-3.0"
keywords = ["build", "schema", "wasm"]
categories = ["development-tools::build-utils"]

[dependencies]
wasmparser = "0.219"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
