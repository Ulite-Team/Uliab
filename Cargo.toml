[workspace]
resolver = "2"
members = [
    "crates/ulb-lang",
    "crates/ulb-plugin-sdk",
    "crates/ulb-plugin-fixture",
    "crates/ulb-plugin-legacy-fixture",
    "crates/ulb-plugin-cross-dep-fixture",
    "crates/uliab",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0"

# deny, not forbid: the bindings generated by wasmtime's component `bindgen!`
# and wit-bindgen's `generate!` use `unsafe` internally. The scoped
# `#[allow(unsafe_code)]` lives on the generated binding modules; all other
# code in every workspace crate stays under `deny`.
[workspace.lints.rust]
unsafe_code = "deny"
